name: 2. チャンネル情報を集める（初回・月1回）

# ゲーム辞書の作成と、チャンネルの登録者数・最終投稿日・ゲーム動画率の取得。
# 初回に1回、そのあとは月1回くらい動かせば十分です。
on:
  workflow_dispatch:
    inputs:
      igdb:
        description: "ゲーム辞書も作り直す（初回は yes）"
        required: true
        default: "yes"
        type: choice
        options: ["yes", "no"]
      discover:
        description: "新しい配信チャンネルを探す（増やしたいときだけ yes）"
        required: true
        default: "no"
        type: choice
        options: ["no", "yes"]
      searches:
        description: "探すときの検索回数（1回100ポイント／1日の上限9000）"
        required: false
        default: "40"

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ★スクリプトの「名前の誤り」を先に見る（2026-10-20 に足した）
      #
      # 2026-09-26から10-20まで、`igdb_sync.py` が UnboundLocalError で
      # **毎回こけていた**のに気づけなかった。発売年（"y"）を足したとき、
      # それを使う行より**下**に `from datetime import ...` が残っていて、
      # 関数の中で import すると、その名前は関数ぜんぶでローカル変数になる。
      #
      # 性質が悪いのは、**50,000本を取り終えてから落ちる**こと。
      # 10分ぶんの取得が毎回むだになっていた。ここなら2秒で止まる。
      #
      # 止めるのは `undefined name`（＝実行したら必ず落ちる）だけ。
      # 使っていない import のような小言で止めると、読まれなくなる。
      - name: スクリプトの下見（名前の誤りだけ）
        run: |
          pip install --quiet pyflakes
          out=$(python -m pyflakes scripts/*.py | grep "undefined name" || true)
          if [ -n "$out" ]; then
            echo "::error::スクリプトに未定義の名前があります。直してから回してください"
            echo "$out"
            exit 1
          fi
          echo "名前の誤りはありませんでした"

      - name: ゲーム辞書をIGDBから作る
        if: ${{ inputs.igdb == 'yes' }}
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python scripts/igdb_sync.py

      - name: 新しいチャンネルを探す
        if: ${{ inputs.discover == 'yes' }}
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          MAX_SEARCHES: ${{ inputs.searches }}
        run: python scripts/discover_channels.py

      - name: チャンネル情報を集める
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/enrich_channels.py

      - name: 結果をダウンロードできるようにする
        uses: actions/upload-artifact@v4
        with:
          # 実行番号を付ける。付けないと古い実行の結果と見分けがつかず、
          # 前回のファイルを開いて「変わっていない」と誤解する事故が起きる。
          name: channels_review_${{ github.run_number }}
          path: |
            data/channels_review.csv
            data/channels_discovered.csv

      - name: 結果を保存
        run: |
          git config user.name "hayarige-bot"
          git config user.email "actions@github.com"
          # 実行中にGitHub上でファイルを触ると push が弾かれるので、先に取り込む
          git pull --rebase --autostash origin main || true
          git add data/
          git diff --staged --quiet || git commit -m "チャンネル情報を更新"
          git push
