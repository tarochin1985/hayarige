name: 3. 毎日の更新

# 日本時間の 7時・19時ごろに自動で動きます。
# 手動で動かしたいときは Actions タブから「Run workflow」。
on:
  schedule:
    # ---- 回数について ----------------------------------------------------
    # 以前は1日4回（7/13/19/23時）だった。GitHubの定期実行は「混雑時に遅れる
    # ことがある」と公式に書かれていて、実際に飛ぶこともある（8/27の朝7時）。
    # 1日1回だとそれが即「その日は更新なし」になるので、回数で保険をかけていた。
    #
    # ただしYouTubeの1日の上限は10,000ポイントで、これは
    #   「3番の消費」＋「2番（チャンネルを探す・調べ直す）の消費」
    # の合計にかかる。8/29に実際に使い切って、朝の取得が0本になった。
    #
    # いまは登録チャンネルを増やしている最中で、2番を回す機会が多い。
    # 3番の回数を減らしてそちらに枠を回すほうが、サイトの中身は良くなる。
    # 目視で手をかける時期を抜けたら3回に戻す（下の計算式を参照）。
    #
    # ---- 消費の計算 ------------------------------------------------------
    #   3番 1回 ＝ 対象チャンネル数 × 約1.2ポイント
    #   いまの対象は約1,000件 → 1回およそ1,200ポイント
    #     2回/日 = 2,400   ← いまここ。2番に7,600残る
    #     3回/日 = 3,600      2番に6,400残る
    #     4回/日 = 4,800      2番に5,200残る（探索3,000＋調べ直しで足りなくなる）
    #   2番 ＝ 探索30回で3,000 ＋ 調べ直し（新しいチャンネルの分だけなら数百）
    #
    # 対象チャンネルが増えたら1回の消費も増える。3,000件まで増えたら
    # 2回/日で7,200になり、また足りなくなる。そのときは回数か対象数の調整が要る。
    #
    # ---- 時刻について ----------------------------------------------------
    # 7時は、朝のリマインドが8時に見に来るので必須。
    # もう片方は12時間あけて19時にした。7時と23時にすると日中ずっと
    # 朝のままになってしまい、いちばん人が見る時間帯が古くなる。
    #
    # ---- ★2026-10-25：0分をやめて、1つの枠に6回ずつ声をかける形に変えた ----
    #
    # たろちんさん「自動更新が最近数時間レベルでズレている」。
    # **コミットの時刻で実際に数えた**（10-15〜10-25の10〜11回ぶん）。
    #
    #   予定 22:00 UTC（日本時間 7:00）… 中央値 134分おくれ / 最大 156分
    #   予定 10:00 UTC（日本時間 19:00）… 中央値 260分おくれ / 最大 305分
    #
    # 朝の更新が日本時間9時すぎに終わっていた。**8時の朝のリマインドは、
    # その前の晩のデータを見ていたということ。** 夜は23時すぎだった。
    #
    # GitHubの定期実行は「混雑時に遅れることがある」と公式に書かれていて、
    # **いちばん混むのは毎時0分**。1日2回・どちらも0分に置いていたので、
    # まるごと行列の後ろに並んでいた。
    #
    # そこで「0分を避けて、1つの枠に30分おきに6回声をかける」形にした。
    # **先に届いたものが仕事をして、残りは関所（下の gate）で止まる。**
    # 止まるぶんは数十秒で終わり、YouTubeのクォータは1ポイントも使わない。
    # 公開リポジトリなのでActionsの実行時間は無料。
    #
    # ※ GitHubは定期実行の時刻を保証していない。これでも駄目なら、
    #   外から `workflow_dispatch` を叩く形にするしかない（そちらは遅れない）。
    #
    # ---- ★2026-10-27：1日ようすを見た結果 --------------------------------
    #
    # **効かなかった。** Actionsタブで数えたら、
    # **1つの枠から定期実行は1回しか作られていない**（6回ではない）。
    #
    #   #277  夜の枠（最後の声は 20:41）→ 実際に走ったのは **翌 01:05**（4時間24分）
    #   #278  朝の枠（最後の声は  8:41）→ 実際に走ったのは     **9:24**（43分）
    #
    # GitHubは、同じワークフローの定期実行が1つ待っている間、
    # **あとから来た定期実行を作らない**ように見える。だから
    # **cronの行を増やしても回数は増えない。** 遅れもほぼ元のまま。
    #
    # ただし**害も無い**（増えないので実行時間も食わない）。
    # 枠の頭が6:11・18:11と早くなるぶん、行列に並ぶのが早い。そのまま残す。
    #
    # **時刻をきっちり合わせたいなら、外から workflow_dispatch を叩くしかない。**
    # それにはGitHubのトークンが要るので、たろちんさんが用意するものになる。
    - cron: "11,41 21,22,23 * * *"   # 日本時間 6:11 / 6:41 / 7:11 / 7:41 / 8:11 / 8:41
    - cron: "11,41 9,10,11 * * *"    # 日本時間 18:11 / 18:41 / 19:11 / 19:41 / 20:11 / 20:41
  workflow_dispatch:
    inputs:
      fetch:
        # ---- なぜこの選択肢があるか（2026-09-26） -------------------------
        # サイトの作りを変えた日は、直すたびにここを回したくなる。だが
        # 回すたびにYouTubeのクォータを約2,500ポイント使う。9月26日は
        # 1日に5回回して上限に当たり、**その日の収集が0本になった。**
        #
        # よく考えると、作りを変えた日にやりたいのは「サイトを作り直す」
        # ことだけで、**配信を取り直す必要はない。** 同じ日にもう一度
        # 取っても、中身はほとんど変わらない。
        #
        # そこで「no」を選べるようにした。**no なら1ポイントも使わない。**
        # 手元にあるデータでサイトだけ作り直す。
        # コードや見た目を直したあとは、こちらを使うこと。
        description: "配信を取り直す（サイトの作りを変えただけなら no でよい）"
        required: true
        default: "yes"
        type: choice
        options: ["yes", "no"]

jobs:
  # ---------------------------------------------------------------- 関所
  # **YouTubeのクォータを使う前に、走るかどうかだけを決める。**
  # 中身は scripts/should_run.py に書いてある（止める条件は2つだけ）。
  #
  #   ・同じ枠（朝＝日本時間4〜16時 / 夜＝16〜翌4時）でもう取り込んでいる
  #   ・前の取り込みから6時間たっていない
  #
  # たろちんさんが言っていた「気づいて手で回したあと、遅れて届いた
  # 定期実行がもう一度取りに行く」のは1つ目で止まる。手で回したときは必ず走る。
  #
  # ★ここが失敗したら更新が全部止まる、というのがいちばん悪いので、
  #   **壊れたときは「走る」側に倒してある**（下の if も go == 'no' のときだけ止める）。
  gate:
    name: 走るかどうかを決める
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.judge.outputs.go }}
    steps:
      # 判断に要るのは2つのファイルだけなので、そこだけ取り出す（数秒で終わる）
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            data/last_fetch.json
            scripts/should_run.py
          sparse-checkout-cone-mode: false
      - id: judge
        run: python3 scripts/should_run.py

  update:
    name: 集めてサイトを作る
    needs: gate
    # ★ go が 'no' のときだけ止める。関所が失敗して空になったときは走る。
    if: ${{ !cancelled() && needs.gate.outputs.go != 'no' }}
    runs-on: ubuntu-latest
    # ★25分 → 40分（2026-10-27）。**25分で枠がまるごと1つ飛んだ。**
    # Actionsタブを見たら、10-26の夜の定期実行（#277）が
    # **25分29秒で「取り消し」**になっていた。これは偶然ではなく、
    # ここに書いてあった25分の上限に当たったということ。
    # 1回の更新はいま19〜21分かかっている（#272 18分33秒 / #274 19分44秒 /
    # #278 21分8秒）ので、上限とほとんど差が無かった。
    # 対象チャンネルは毎週増えるので、ここは広めに取る。
    # 本当に詰まったときの保険としては40分でも十分短い。
    timeout-minutes: 40
    permissions:
      contents: write
    # 前の実行が走っている間は待つ。**打ち切らない。**
    # 以前は cancel-in-progress: true で打ち切っていたが、1つの枠に6回
    # 声をかける形にしたので、**走っている最中の実行を後ろの声が
    # 打ち切ってしまう**（push の途中だと中途半端になる）。
    # 詰まったものは timeout-minutes（40分）で勝手に終わる。
    concurrency:
      group: daily-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 発売直後・発売前のゲームだけを辞書に足す。
      # 誤検出でいちばん多いのが「昨日出たゲームが辞書に無い」ケースで、
      # しかも発売直後がいちばん配信される。月1回の作り直しでは間に合わない。
      # IGDB（Twitch）だけを使うので、YouTubeのクォータは1ポイントも減らない。
      # ここが失敗しても、その日の更新は止めない。
      - name: 新作を辞書に足す
        continue-on-error: true
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python scripts/igdb_recent.py

      # ★ 取りに行く直前に、もう一度関所を通す（2026-10-25）。
      #
      # 関所（gate）は行列に並ばないので、**前の実行がまだ push していない
      # 間に次の関所が通ってしまう**ことがある。そのまま行列を抜けると
      # 2回取りに行って、クォータを2,600ぶん無駄にする。
      # この job の checkout は行列を抜けたあとに走るので、
      # ここで見れば前の実行の記録がもう入っている。
      - name: 取りに行く直前に、もう一度関所を通す
        id: gate2
        run: python scripts/should_run.py

      # 定期実行（schedule）のときは inputs が空になるので、この条件は必ず真。
      # 手で「no」を選んだときだけ飛ばす。
      - name: 新着の配信を集める
        if: ${{ inputs.fetch != 'no' && steps.gate2.outputs.go != 'no' }}
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/fetch_daily.py

      # 取り込んだ時刻を残す。**次の関所がこれを読む。**
      # クォータが足りなくて fetch_daily が取りに行かなかった場合も記録する
      # （「この枠はもう当たった」という意味なので、同じ枠で何度も
      # サイトを作り直さずに済む）。
      - name: 取り込んだ時刻を記録する
        if: ${{ inputs.fetch != 'no' && steps.gate2.outputs.go != 'no' }}
        run: python scripts/should_run.py --mark

      - name: 収集を飛ばしました
        if: ${{ inputs.fetch == 'no' || steps.gate2.outputs.go == 'no' }}
        run: echo "配信の取り直しは飛ばしました。YouTubeのクォータは使っていません。手元のデータでサイトだけ作り直します。"

      # 週・月のまとめのページに置く画像（site/w/<日付>/card.png）。
      # Xに貼るカードと同じ絵を、記事のページ・トップ・一覧・SNSの共有画像で使う。
      #
      # **build_site.py より先に置くこと。** build_site は「その画像が
      # あるかどうか」を見て貼るか決めるので、順番が逆だと、画像の無い
      # HTMLを書いたあとに画像ができることになる（翌日まで出ない）。
      #
      # すでにある画像は作り直さないので、ふだんは数秒で終わる。
      # YouTubeのクォータは1ポイントも使わない。
      # ここが失敗しても、その日の更新は止めない（画像が無いだけ）。
      # ★Playwrightの用意は1回だけにした（2026-10-27）。
      # 以前は「まとめのページの画像」と「ツイート用の画像」の両方で
      # `playwright install --with-deps chromium` を呼んでいて、
      # **apt の取得を1回の更新で2回**していた。上のとおり25分の上限に
      # 当たって枠が飛んだので、まず無駄をなくす。
      # ここが失敗しても、その日の更新は止めない（画像が無いだけ）。
      - name: 画像を作る道具を用意する
        continue-on-error: true
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: まとめのページの画像を作る
        continue-on-error: true
        run: python scripts/make_week_card.py --site

      - name: 集計してサイトを作る
        run: python scripts/build_site.py

      # Xに貼る1枚画像。ここで作るのには理由がある。
      # この画像はGoogle Fontsの書体とYouTubeのサムネイルを読み込む。
      # 手元（Claudeの作業環境）からはどちらにもつながらないため、
      # そこで作ると書体が別のものに置き換わり、サムネイルも空欄になる。
      # ネットにつながるここで作れば、いつも同じ見た目になる。
      # 失敗してもサイトの更新は止めない。
      - name: ツイート用の画像を作る
        continue-on-error: true
        run: python scripts/make_card.py --png

      # Blueskyへの自動投稿。文と画像は上で作ったものをそのまま使う。
      # **鍵（アプリパスワード）が入っていなければ、何もせず終わる。**
      # 同じコラムを2回投稿しないよう data/bluesky_posted.json に記録を残すので、
      # このステップは「保存して公開」より前に置くこと。
      # ここが失敗しても、サイトの更新は止めない。
      - name: Blueskyに投稿する
        continue-on-error: true
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: python scripts/post_bluesky.py

      - name: 保存して公開
        run: |
          git config user.name "hayarige-bot"
          git config user.email "actions@github.com"
          # 実行中にGitHub上でファイルを触ると push が弾かれるので、先に取り込む
          git pull --rebase --autostash origin main || true
          git add data/ site/
          git diff --staged --quiet || git commit -m "更新 $(date -u +%Y-%m-%d)"
          git push
