name: 3. 毎日の更新

# 日本時間の 7時・13時・19時・23時ごろに自動で動きます。
# 手動で動かしたいときは Actions タブから「Run workflow」。
on:
  schedule:
    # GitHubの定期実行は「混雑時に遅れることがある」と公式に書かれており、
    # 実際に飛ぶこともある（8/27の朝7時は動かなかった）。1日1回だと
    # それが即「その日は更新なし」になるので、1日4回に分けて保険をかける。
    # ついでに、再生数が1日4回更新されるという利点もある。
    - cron: "0 22 * * *"      # UTC 22:00 = 日本時間 翌 7:00
    - cron: "0  4 * * *"      # UTC 04:00 = 日本時間    13:00
    - cron: "0 10 * * *"      # UTC 10:00 = 日本時間    19:00
    - cron: "0 14 * * *"      # UTC 14:00 = 日本時間    23:00
  workflow_dispatch:

# 前の実行が詰まっていたら、新しい実行が引き継いで打ち切る
concurrency:
  group: daily
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25      # これを超えたら自動で止まる
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 新着の配信を集める
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/fetch_daily.py

      - name: 集計してサイトを作る
        run: python scripts/build_site.py

      - name: 保存して公開
        run: |
          git config user.name "hayarige-bot"
          git config user.email "actions@github.com"
          # 実行中にGitHub上でファイルを触ると push が弾かれるので、先に取り込む
          git pull --rebase --autostash origin main || true
          git add data/ site/
          git diff --staged --quiet || git commit -m "更新 $(date -u +%Y-%m-%d)"
          git push
