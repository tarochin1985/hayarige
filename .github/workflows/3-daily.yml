name: 3. 毎日の更新

# 日本時間の 7時・19時ごろに自動で動きます。
# 手動で動かしたいときは Actions タブから「Run workflow」。
on:
  schedule:
    # ---- 回数について ----------------------------------------------------
    # 以前は1日4回（7/13/19/23時）だった。GitHubの定期実行は「混雑時に遅れる
    # ことがある」と公式に書かれていて、実際に飛ぶこともある（8/27の朝7時）。
    # 1日1回だとそれが即「その日は更新なし」になるので、回数で保険をかけていた。
    #
    # ただしYouTubeの1日の上限は10,000ポイントで、これは
    #   「3番の消費」＋「2番（チャンネルを探す・調べ直す）の消費」
    # の合計にかかる。8/29に実際に使い切って、朝の取得が0本になった。
    #
    # いまは登録チャンネルを増やしている最中で、2番を回す機会が多い。
    # 3番の回数を減らしてそちらに枠を回すほうが、サイトの中身は良くなる。
    # 目視で手をかける時期を抜けたら3回に戻す（下の計算式を参照）。
    #
    # ---- 消費の計算 ------------------------------------------------------
    #   3番 1回 ＝ 対象チャンネル数 × 約1.2ポイント
    #   いまの対象は約1,000件 → 1回およそ1,200ポイント
    #     2回/日 = 2,400   ← いまここ。2番に7,600残る
    #     3回/日 = 3,600      2番に6,400残る
    #     4回/日 = 4,800      2番に5,200残る（探索3,000＋調べ直しで足りなくなる）
    #   2番 ＝ 探索30回で3,000 ＋ 調べ直し（新しいチャンネルの分だけなら数百）
    #
    # 対象チャンネルが増えたら1回の消費も増える。3,000件まで増えたら
    # 2回/日で7,200になり、また足りなくなる。そのときは回数か対象数の調整が要る。
    #
    # ---- 時刻について ----------------------------------------------------
    # 7時は、朝のリマインドが8時に見に来るので必須。
    # もう片方は12時間あけて19時にした。7時と23時にすると日中ずっと
    # 朝のままになってしまい、いちばん人が見る時間帯が古くなる。
    - cron: "0 22 * * *"      # UTC 22:00 = 日本時間 翌 7:00
    - cron: "0 10 * * *"      # UTC 10:00 = 日本時間    19:00
  workflow_dispatch:

# 前の実行が詰まっていたら、新しい実行が引き継いで打ち切る
concurrency:
  group: daily
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25      # これを超えたら自動で止まる
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 発売直後・発売前のゲームだけを辞書に足す。
      # 誤検出でいちばん多いのが「昨日出たゲームが辞書に無い」ケースで、
      # しかも発売直後がいちばん配信される。月1回の作り直しでは間に合わない。
      # IGDB（Twitch）だけを使うので、YouTubeのクォータは1ポイントも減らない。
      # ここが失敗しても、その日の更新は止めない。
      - name: 新作を辞書に足す
        continue-on-error: true
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python scripts/igdb_recent.py

      - name: 新着の配信を集める
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/fetch_daily.py

      - name: 集計してサイトを作る
        run: python scripts/build_site.py

      - name: 保存して公開
        run: |
          git config user.name "hayarige-bot"
          git config user.email "actions@github.com"
          # 実行中にGitHub上でファイルを触ると push が弾かれるので、先に取り込む
          git pull --rebase --autostash origin main || true
          git add data/ site/
          git diff --staged --quiet || git commit -m "更新 $(date -u +%Y-%m-%d)"
          git push
