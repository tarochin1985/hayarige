const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const man = n => n >= 10000 ? (n/10000).toFixed(n >= 100000 ? 0 : 1) + '万' : (n||0).toLocaleString();

function spark(v, w, h, color){
  if (!v || !v.length) return '';
  const mx = Math.max(...v, 1), dx = w / Math.max(1, v.length - 1);
  const y = n => h - 3 - n / mx * (h - 6);
  const p = v.map((n, i) => [i * dx, y(n)]);
  const line = p.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ');
  const last = p[p.length - 1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true" style="display:block">
    <path d="${line} L${w} ${h} L0 ${h} Z" fill="${color}" opacity=".13"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3" fill="${color}"/></svg>`;
}

let orgFilter = null;

function render(){
  const AC = cssv('--accent'), HOT = cssv('--hot'), t = DATA.totals || {};
  $('#s-date').textContent = (DATA.date || '').replace(/-/g, '.');
  $('#s-meta').textContent = `配信 ${t.videos||0}本 / ゲーム ${t.games||0}種 / ${t.channels||0}ch`;
  $('#f-gen').textContent = '最終更新 ' + (DATA.generated || '');

  $('#hot').innerHTML = (DATA.rising || []).length
    ? DATA.rising.map(r => `<article class="hotcard">
        <div class="n">${esc(r.game)}</div>
        <div class="x"><b>×${(r.growth||1).toFixed(1)}</b><span>週の前半とくらべて</span></div>
        ${spark(r.spark, 200, 34, HOT)}
        <div class="f"><span>きょう ${r.videos}件</span><span>${r.channels}チャンネル</span></div>
      </article>`).join('')
    : '<div class="empty">今日は目立った急上昇はありませんでした。</div>';

  const orgs = {};
  (DATA.ranking || []).forEach(r => Object.entries(r.orgs || {}).forEach(([k, v]) => orgs[k] = (orgs[k]||0) + v));
  const keys = Object.entries(orgs).sort((a,b) => b[1]-a[1]).slice(0, 7).map(x => x[0]);
  $('#filters').innerHTML = ['すべて', ...keys].map(k =>
    `<button type="button" data-org="${esc(k)}" aria-pressed="${(orgFilter===null&&k==='すべて')||orgFilter===k}">${esc(k)}</button>`).join('');

  const list = (DATA.ranking || []).filter(r => !orgFilter || (r.orgs && r.orgs[orgFilter]));
  const top = Math.max(1, ...list.map(r => r.score || 0));
  $('#rows').innerHTML = list.map((r, i) => {
    const mv = r.videos < 3 ? '<span class="mv fl">—</span>'
      : r.growth >= 1.25 ? `<span class="mv up">▲ ×${r.growth.toFixed(1)}</span>`
      : '<span class="mv fl">—</span>';
    const orgTxt = Object.entries(r.orgs || {}).slice(0, 2).map(([k, v]) => `${k} ${v}`).join(' · ');
    const streams = (r.streams || []).map(s => `<a class="stream" href="${esc(s.u)}" target="_blank" rel="noopener">
        ${s.th ? `<img src="${esc(s.th)}" alt="" loading="lazy">` : ''}
        <span><span class="t">${esc(s.t)}</span><span class="c">${esc(s.c)} ・ ${man(s.v)}回</span></span></a>`).join('');
    return `<tr class="main" data-i="${i}">
      <td class="rk">${i + 1}</td>
      <td><span class="gname">${esc(r.game)}</span><span class="chs">${esc(orgTxt)}</span></td>
      <td class="ptcell"><div class="pt"><span class="track"><span class="fill" style="width:${Math.max(4,(r.score||0)/top*100)}%"></span></span><span class="v">${Math.round(r.score||0)}</span></div></td>
      <td class="brk">${r.videos}件 · ${r.channels}ch · ${man(r.views)}回</td>
      <td>${spark(r.spark, 78, 24, AC)}</td>
      <td>${mv}</td>
      <td><span class="buy"><a href="${esc(r.steam)}" target="_blank" rel="noopener sponsored">Steam</a><a href="${esc(r.amazon)}" target="_blank" rel="noopener sponsored">Amazon</a></span></td></tr>
    <tr class="detail"><td colspan="7">${streams ? `<div class="streams">${streams}</div>` : '<span style="color:var(--ink-3);font-size:12.5px">配信の情報がありません</span>'}</td></tr>`;
  }).join('') || '<tr><td colspan="7" style="padding:26px;text-align:center;color:var(--ink-3)">データがまだありません</td></tr>';

  const q = DATA.unknown || [];
  $('#q-sec').style.display = q.length ? '' : 'none';
  $('#queue').innerHTML = q.map(u =>
    `<div class="qrow"><span class="t"><a href="${esc(u.u)}" target="_blank" rel="noopener">${esc(u.title)}</a></span><span class="g">要確認</span></div>`).join('');
}

document.addEventListener('click', e => {
  const b = e.target.closest('#filters button');
  if (b){ orgFilter = b.dataset.org === 'すべて' ? null : b.dataset.org; render(); return; }
  const tr = e.target.closest('tr.main');
  if (tr && !e.target.closest('a')) tr.nextElementSibling.classList.toggle('open');
});
render();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
</script>
</body></html>
